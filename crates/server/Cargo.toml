[package]
name = "cipherstream-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tower-http = { version = "0.5", features = ["fs", "cors"] }
async-trait = "0.1"

# IDs + timestamps
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Database — PostgreSQL via sqlx
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "macros", "chrono", "uuid"] }

# Redis queue
fred = { version = "9", default-features = false, features = ["tokio-runtime", "i-streams", "i-keys"] }

# Storage backends
aws-config = { version = "1" }
aws-sdk-s3 = { version = "1" }
aws-credential-types = { version = "1" }
