services:
  cipherstream:
    build: .
    ports:
      - "8080:8080"
      - "1081:1081"
    environment:
      CIPHERSTREAM_CONFIG: /app/config.toml
    volumes:
      - cipherstream-data:/app/data

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: cipherstream
      MINIO_ROOT_PASSWORD: cipherstream-secret
    volumes:
      - minio-data:/data

volumes:
  cipherstream-data:
  minio-data:
